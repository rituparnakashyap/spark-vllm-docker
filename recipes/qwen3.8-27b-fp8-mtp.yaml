# Recipe: Qwen3.8-27B-FP8 with MTP speculative decoding
#
# This is the project's actual production daily-driver config, in use
# since 2026-08-15 (well before this recipe file itself was written --
# added retroactively 2026-08-25 to make the known-working launch
# reproducible via this repo's own tooling instead of only existing as a
# hand-built docker exec script on the hosts).
#
# Dense model, NOT MoE -- no --moe-backend needed. Does not hit the
# FlashInfer/DeepGEMM multi-node JIT deadlocks the Qwen3.5-122B-A10B
# recipes in this repo had to work around (see those recipes' comments
# for the full writeup) -- raw no-Ray multi-node mode has always worked
# fine for this model, so --distributed-executor-backend ray is
# deliberately NOT set here. If a future vLLM/model update ever
# reproduces that stall class for this model too, the fix pattern is
# documented in qwen3.5-122b-fp8-mtp.yaml.
#
# tp=2 tested and barely beats solo (dense models don't scale well with
# tensor-parallel over a bandwidth-limited ConnectX link -- no per-token
# all-reduce savings the way MoE gets from expert-parallel sharding),
# pipeline-parallel tested and was much WORSE (7-8 tok/s, PP serializes
# single-stream requests through both nodes sequentially). Kept tp=2
# anyway, mainly for the KV-cache/context headroom, not for a throughput
# win. num_speculative_tokens=3 confirmed optimal for this model via
# direct empirical benchmarking (2 and 4 both measured worse) -- unlike
# Qwen3.5-122B-A10B, where 3 was confirmed WORSE than 2. Don't assume
# either model's MTP setting transfers to the other.
#
# Real measured throughput (single-stream, 500-token generation):
# ~13-15 tok/s using this project's own bench.sh methodology (a "24-27
# tok/s" figure floating around earlier in this project's history was
# from noisy Grafana rate() aggregate sampling, not a clean single-stream
# comparison -- don't use it as the baseline to compare future runs
# against, use a fresh bench.sh run instead).
#
# max_num_seqs=8 set 2026-08-25. KV cache headroom at gpu_memory_utilization=0.5
# measured 8.70x concurrency at FULL 262144-token context on the actual
# live launch (comfortable margin over 8, better than initially estimated
# from an older measurement -- always check the real
# "Maximum concurrency for <max_model_len> tokens per request" line in
# this model's own startup log rather than trusting this comment's number
# if gpu_memory_utilization or max_model_len ever change).
#
# Exposed as a proper {max_num_seqs} template default (not hardcoded in
# the command) so it's a visible, editable knob like the other params --
# but note run-recipe.py's --port/--host/--tp/--gpu-mem/--max-model-len
# CLI overrides are a FIXED set (checked the source directly, 2026-08-25)
# with no generic defaults->flag mechanism, so there is no
# --max-num-seqs CLI flag. To override per-launch without editing this
# file, use the `-- --max-num-seqs N` passthrough documented in the main
# README's "Recipe Overrides and Additional vLLM Arguments" section --
# vLLM takes the last occurrence when a flag is repeated.

recipe_version: "1"
name: Qwen3.8-27B-FP8-MTP
description: vLLM serving Qwen3.8-27B-FP8 with MTP speculative decoding

# HuggingFace model to download (optional, for --download-model)
model: Qwen/Qwen3.8-27B-FP8

# Only cluster is supported
cluster_only: true

# Container image to use
container: vllm-node

# No mods required -- Qwen3.8 doesn't need the chat-template fix
# Qwen3.5-122B-A10B's recipes apply.
mods: []

# Default settings (can be overridden via CLI)
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.5
  max_model_len: 262144
  max_num_seqs: 8

# Environment variables
env: {}

# The vLLM serve command template
command: |
  vllm serve Qwen/Qwen3.8-27B-FP8 \
    --port {port} \
    --host {host} \
    --tensor-parallel-size {tensor_parallel} \
    --trust-remote-code \
    --kv-cache-dtype fp8 \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --reasoning-parser qwen3 \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_xml \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":3}}'
